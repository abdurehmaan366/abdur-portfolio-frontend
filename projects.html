<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Abdur Rehman</title>
  <meta name="description"
    content="Backend projects by Abdur Rehman, including Pantry Inventory (session-based auth), a Dockerized CRUD Todo API, and The Polite Scraper." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090B0E;
      transition: opacity 350ms ease-out;
    }

    #page-loader .loader-card {
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 1.75rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    #page-loader .loader-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.125rem;
      color: #F3F4F6;
    }

    #page-loader .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #22C55E;
      box-shadow: 0 0 12px #22C55E, 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    #page-loader .loader-dots {
      display: flex;
      gap: 0.4rem;
    }

    #page-loader .loader-dots span {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background-color: #22C55E;
      opacity: 0.35;
      animation: loader-bounce 1s infinite ease-in-out;
    }

    #page-loader .loader-dots span:nth-child(2) {
      animation-delay: 150ms;
    }

    #page-loader .loader-dots span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes loader-bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
  </style>
</head>

<body data-active="/projects.html" class="font-body">
  <div id="page-loader">
    <div class="loader-card">
      <span class="loader-brand">
        <span class="loader-dot"></span>
        Abdur Rehman
      </span>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <liquid-glass refraction="1.45" frost="14" thickness="24" specular="0.8">
    <div id="nav"></div>

    <main>
      <section class="mx-auto max-w-6xl px-5 sm:px-8 pt-16 pb-4 sm:pt-24">
        <p class="eyebrow mb-3"><span class="status-dot mr-2"></span>projects</p>
        <h1 class="font-display font-semibold text-3xl sm:text-5xl lg:text-6xl max-w-3xl text-ink">
          Backend projects, starting with the one I'm proudest of.
        </h1>
      </section>

      <!-- FEATURED PROJECT(S) — rendered by projects-page.js from config.js -->
      <div id="featured-projects"></div>

      <!-- OTHER PROJECTS — rendered by projects-page.js from config.js -->
      <section class="mx-auto max-w-6xl px-5 sm:px-8 pb-16 sm:pb-20">
        <p class="eyebrow mb-6"><span class="status-dot mr-2"></span>other projects</p>
        <div id="other-projects" class="grid sm:grid-cols-2 gap-6"></div>
      </section>

      <!-- GET IN TOUCH -->
      <section class="mx-auto max-w-6xl px-5 sm:px-8 pb-20 sm:pb-28">
        <div class="liquid-card glass p-8 sm:p-12 flex flex-col sm:flex-row sm:items-center justify-between gap-6 border border-white/12">
          <div>
            <h2 class="font-display font-semibold text-2xl text-ink">Scouting backend intern talent?</h2>
            <p class="text-ink-60 mt-2 max-w-md leading-relaxed">I'd like to hear from you directly — reach out and let's talk.</p>
          </div>
          <a href="/contact.html" class="liquid-button btn-primary shrink-0 glass">Get in Touch</a>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </liquid-glass>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/projects-page.js"></script>
</body>

</html>
