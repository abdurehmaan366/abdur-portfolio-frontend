<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Abdur Rehman</title>
  <meta name="description"
    content="Backend projects by Abdur Rehman, including Pantry Inventory (session-based auth), a Dockerized CRUD Todo API, and The Polite Scraper." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFA;
      transition: opacity 300ms ease-out;
    }

    #page-loader .loader-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.125rem;
      color: #111111;
    }

    #page-loader .loader-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background-color: #22C55E;
      box-shadow: 0 0 0 3px #F0FDF4;
    }

    #page-loader .loader-dots {
      display: flex;
      gap: 0.375rem;
      margin-top: 1rem;
    }

    #page-loader .loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #7A7A7A;
      animation: loader-bounce 1s infinite ease-in-out;
    }

    #page-loader .loader-dots span:nth-child(2) {
      animation-delay: 150ms;
    }

    #page-loader .loader-dots span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes loader-bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
  </style>
</head>

<body data-active="/projects.html" class="font-body">
  <div id="nav"></div>
  <div id="page-loader">
    <div style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
      <span class="loader-brand">
        <span class="loader-dot"></span>
        Abdur Rehman
      </span>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <main>
    <section class="mx-auto max-w-6xl px-5 sm:px-8 pt-14 pb-4 sm:pt-20">
      <p class="eyebrow mb-3">projects</p>
      <h1 class="font-display font-semibold text-3xl sm:text-5xl max-w-2xl">Backend projects, starting with the one I'm
        proudest of.</h1>
    </section>

    <!-- FEATURED PROJECT(S) — rendered by projects-page.js from config.js -->
    <div id="featured-projects"></div>

    <!-- OTHER PROJECTS — rendered by projects-page.js from config.js -->
    <section class="mx-auto max-w-6xl px-5 sm:px-8 pb-16 sm:pb-20">
      <p class="eyebrow mb-6">other projects</p>
      <div id="other-projects" class="grid sm:grid-cols-2 gap-6"></div>
    </section>

    <!-- GET IN TOUCH -->
    <section class="mx-auto max-w-6xl px-5 sm:px-8 pb-20 sm:pb-28">
      <div class="card p-8 sm:p-12 flex flex-col sm:flex-row sm:items-center justify-between gap-6">
        <div>
          <h2 class="font-display font-semibold text-2xl">Scouting backend intern talent?</h2>
          <p class="text-ink-60 mt-2 max-w-md">I'd like to hear from you directly — reach out and let's talk.</p>
        </div>
        <a href="/contact.html" class="btn-primary shrink-0">Get in Touch</a>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/projects-page.js"></script>
</body>

</html>
