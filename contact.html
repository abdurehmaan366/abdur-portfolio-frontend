<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Abdur Rehman</title>
  <meta name="description" content="Get in touch with Abdur Rehman about backend engineering intern opportunities." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090B0E;
      transition: opacity 350ms ease-out;
    }

    #page-loader .loader-card {
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 1.75rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    #page-loader .loader-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.125rem;
      color: #F3F4F6;
    }

    #page-loader .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #22C55E;
      box-shadow: 0 0 12px #22C55E, 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    #page-loader .loader-dots {
      display: flex;
      gap: 0.4rem;
    }

    #page-loader .loader-dots span {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background-color: #22C55E;
      opacity: 0.35;
      animation: loader-bounce 1s infinite ease-in-out;
    }

    #page-loader .loader-dots span:nth-child(2) {
      animation-delay: 150ms;
    }

    #page-loader .loader-dots span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes loader-bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
  </style>
</head>

<body data-active="/contact.html" class="font-body">
  <div id="page-loader">
    <div class="loader-card">
      <span class="loader-brand">
        <span class="loader-dot"></span>
        Abdur Rehman
      </span>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <liquid-glass refraction="1.45" frost="14" thickness="24" specular="0.8">
    <div id="nav"></div>

    <main>
      <section class="mx-auto max-w-5xl px-5 sm:px-8 pt-16 pb-20 sm:pt-24 sm:pb-28">
        <p class="eyebrow mb-4"><span class="status-dot mr-2"></span>contact</p>
        <h1 class="font-display font-semibold text-3xl sm:text-5xl text-ink max-w-xl">Get in Touch</h1>
        <p class="text-ink-60 mt-4 max-w-xl leading-relaxed text-base sm:text-lg">
          Scouting backend intern talent, or want to talk through a project? Send a message and I'll get back to you — or
          reach me directly through the links below.
        </p>

        <div class="grid lg:grid-cols-[1fr_340px] gap-8 sm:gap-12 mt-12">
          <!-- FORM -->
          <form id="contact-form" class="liquid-card glass p-7 sm:p-10 flex flex-col gap-6 border border-white/12">
            <div>
              <label for="name" class="text-sm font-mono text-ink-60">Name</label>
              <input id="name" name="name" type="text" required placeholder="Your name"
                class="mt-2 w-full glass-input px-4 py-3 text-sm" />
            </div>
            <div>
              <label for="email" class="text-sm font-mono text-ink-60">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@company.com"
                class="mt-2 w-full glass-input px-4 py-3 text-sm" />
            </div>
            <div>
              <label for="message" class="text-sm font-mono text-ink-60">Message</label>
              <textarea id="message" name="message" required rows="5" placeholder="What would you like to talk about?"
                class="mt-2 w-full glass-input px-4 py-3 text-sm resize-none"></textarea>
            </div>
            <button type="submit" class="liquid-button btn-primary self-start glass">
              <span>Send Message</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
            <p id="contact-status" class="hidden text-sm text-accent font-mono leading-relaxed p-3 rounded-lg border border-accent/30 bg-accent/10"></p>
          </form>

          <!-- CONTACT LINKS -->
          <div class="flex flex-col gap-4" id="contact-links"></div>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </liquid-glass>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/contact.js"></script>
</body>

</html>
