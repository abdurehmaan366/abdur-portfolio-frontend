<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Abdur Rehman</title>
  <meta name="description" content="Get in touch with Abdur Rehman about backend engineering intern opportunities." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFA;
      transition: opacity 300ms ease-out;
    }

    #page-loader .loader-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.125rem;
      color: #111111;
    }

    #page-loader .loader-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background-color: #22C55E;
      box-shadow: 0 0 0 3px #F0FDF4;
    }

    #page-loader .loader-dots {
      display: flex;
      gap: 0.375rem;
      margin-top: 1rem;
    }

    #page-loader .loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #7A7A7A;
      animation: loader-bounce 1s infinite ease-in-out;
    }

    #page-loader .loader-dots span:nth-child(2) {
      animation-delay: 150ms;
    }

    #page-loader .loader-dots span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes loader-bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
  </style>
</head>

<body data-active="/contact.html" class="font-body">
  <div id="nav"></div>
  <div id="page-loader">
    <div style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
      <span class="loader-brand">
        <span class="loader-dot"></span>
        Abdur Rehman
      </span>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <main>
    <section class="mx-auto max-w-5xl px-5 sm:px-8 pt-16 pb-20 sm:pt-24 sm:pb-28">
      <p class="eyebrow mb-4">contact</p>
      <h1 class="font-display font-semibold text-3xl sm:text-5xl max-w-xl">Get in Touch</h1>
      <p class="text-ink-60 mt-4 max-w-xl leading-relaxed">
        Scouting backend intern talent, or want to talk through a project? Send a message and I'll get back to you — or
        reach me directly through the links below.
      </p>

      <div class="grid lg:grid-cols-[1fr_320px] gap-10 sm:gap-14 mt-12">
        <!-- FORM -->
        <form id="contact-form" class="card p-6 sm:p-8 flex flex-col gap-5">
          <div>
            <label for="name" class="text-sm font-medium">Name</label>
            <input id="name" name="name" type="text" required placeholder="Your name"
              class="mt-1.5 w-full rounded-lg border border-border px-3.5 py-2.5 text-sm bg-white outline-none focus:border-ink transition-colors" />
          </div>
          <div>
            <label for="email" class="text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" required placeholder="you@company.com"
              class="mt-1.5 w-full rounded-lg border border-border px-3.5 py-2.5 text-sm bg-white outline-none focus:border-ink transition-colors" />
          </div>
          <div>
            <label for="message" class="text-sm font-medium">Message</label>
            <textarea id="message" name="message" required rows="5" placeholder="What would you like to talk about?"
              class="mt-1.5 w-full rounded-lg border border-border px-3.5 py-2.5 text-sm bg-white outline-none focus:border-ink transition-colors resize-none"></textarea>
          </div>
          <button type="submit" class="btn-primary self-start">Send Message</button>
          <p id="contact-status" class="hidden text-sm text-ink-60 leading-relaxed"></p>
        </form>

        <!-- CONTACT LINKS -->
        <div class="flex flex-col gap-3" id="contact-links"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/contact.js"></script>
</body>

</html>
